<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>成果附件预览</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; }
body {
  font-family: -apple-system, "PingFang SC", "HarmonyOS Sans", "Microsoft YaHei", sans-serif;
  background: #0d2137;
  color: #e3f2fd;
  display: flex; flex-direction: column;
  overflow: hidden;
}
.preview-top {
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  padding: 10px 16px;
  background: #0f2b4a;
  border-bottom: 1px solid rgba(30,136,229,0.3);
}
.preview-top .title {
  flex: 1; min-width: 0;
  font-size: 15px; font-weight: 600;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.back-btn {
  flex-shrink: 0;
  padding: 8px 16px;
  border: 1px solid rgba(30,136,229,0.4);
  border-radius: 8px;
  background: rgba(30,136,229,0.15);
  color: #90caf9;
  font-size: 14px; font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.back-btn:active { background: rgba(30,136,229,0.3); }

/* 工具栏 */
.pdf-toolbar {
  display: flex; align-items: center; justify-content: center; gap: 14px;
  padding: 8px 16px;
  background: #0f2b4a;
  border-bottom: 1px solid rgba(30,136,229,0.2);
}
.tool-btn {
  padding: 7px 16px;
  border: 1px solid rgba(30,136,229,0.4);
  border-radius: 8px;
  background: rgba(30,136,229,0.12);
  color: #90caf9;
  font-size: 15px; font-weight: 600;
  cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
.tool-btn:disabled { opacity: 0.3; cursor: default; }
.tool-btn:active:not(:disabled) { background: rgba(30,136,229,0.3); }
.page-info { font-size: 14px; color: #90caf9; white-space: nowrap; }

/* 渲染区 */
.pdf-stage {
  flex: 1; overflow: auto;
  -webkit-overflow-scrolling: touch;
  display: flex; align-items: flex-start; justify-content: center;
  background: #37474f;
  padding: 12px;
}
.canvas-wrap { background: #fff; box-shadow: 0 2px 12px rgba(0,0,0,0.4); }
canvas { display: block; }

.msg {
  flex: 1; display: flex; align-items: center; justify-content: center;
  color: #90caf9; font-size: 15px; text-align: center; padding: 24px;
}
.hidden { display: none !important; }
</style>
</head>
<body>

<div class="preview-top">
  <div class="title" id="pvTitle">成果附件预览</div>
  <button class="back-btn" onclick="goBack()">← 返回投票</button>
</div>

<div class="pdf-toolbar">
  <button class="tool-btn" id="btnPrev" onclick="prevPage()">‹ 上一页</button>
  <span class="page-info" id="pageInfo">—</span>
  <button class="tool-btn" id="btnNext" onclick="nextPage()">下一页 ›</button>
  <button class="tool-btn" id="btnZoomOut" onclick="zoom(-0.15)">-</button>
  <button class="tool-btn" id="btnZoomIn" onclick="zoom(0.15)">+</button>
</div>

<div class="pdf-stage" id="pdfStage">
  <div class="msg" id="pdfMsg">正在加载附件，请稍候…</div>
</div>

<script src="/assets/pdfjs/pdf.min.js"></script>
<script>
(function() {
  var params = new URLSearchParams(location.search);
  var file = params.get('file') || '';
  var name = params.get('name') || '';
  if (name) document.getElementById('pvTitle').textContent = name;

  var msg = document.getElementById('pdfMsg');
  var stage = document.getElementById('pdfStage');

  if (!file) { msg.textContent = '附件不存在或已被移除'; return; }

  // PDF.js 渲染（Canvas 绘制，兼容所有浏览器，不依赖浏览器内置PDF查看器）
  pdfjsLib.GlobalWorkerOptions.workerSrc = '/assets/pdfjs/pdf.worker.min.js';

  var pdfDoc = null;
  var pageNum = 1;
  var scale = 1.0;

  var canvas = document.createElement('canvas');
  canvas.className = 'canvas-wrap';
  var wrap = document.createElement('div');
  wrap.className = 'canvas-wrap';
  wrap.appendChild(canvas);
  var ctx = canvas.getContext('2d');

  function renderPage() {
    if (!pdfDoc) return;
    pdfDoc.getPage(pageNum).then(function(page) {
      var viewport = page.getViewport({ scale: scale });
      var dpr = window.devicePixelRatio || 1;
      canvas.width = Math.floor(viewport.width * dpr);
      canvas.height = Math.floor(viewport.height * dpr);
      canvas.style.width = viewport.width + 'px';
      canvas.style.height = viewport.height + 'px';
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      page.render({ canvasContext: ctx, viewport: viewport }).promise.then(function() {
        document.getElementById('pageInfo').textContent = pageNum + ' / ' + pdfDoc.numPages;
        document.getElementById('btnPrev').disabled = pageNum <= 1;
        document.getElementById('btnNext').disabled = pageNum >= pdfDoc.numPages;
        stage.scrollTop = 0;
      });
    });
  }

  function prevPage() { if (pageNum > 1) { pageNum--; renderPage(); } }
  function nextPage() { if (pageNum < pdfDoc.numPages) { pageNum++; renderPage(); } }
  window.prevPage = prevPage;
  window.nextPage = nextPage;
  window.zoom = function(delta) {
    scale = Math.min(3, Math.max(0.4, scale + delta));
    renderPage();
  };

  // 通过相对路径走 Node 代理到后端 /api/files/{filename}
  pdfjsLib.getDocument('/api/files/' + file).promise
    .then(function(doc) {
      pdfDoc = doc;
      msg.classList.add('hidden');
      stage.appendChild(wrap);
      renderPage();
    })
    .catch(function(err) {
      msg.textContent = '附件加载失败：' + (err && err.message ? err.message : '请重试');
    });
})();

function goBack() {
  if (window.history.length > 1) { history.back(); }
  else { window.close(); }
}
</script>
</body>
</html>
